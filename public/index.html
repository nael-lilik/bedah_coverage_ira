<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Peta interaktif untuk cek coverage dan melihat lokasi BTS."
    />
    <title>Peta Coverage & BTS</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="map-shell">
      <div id="map" aria-label="Peta interaktif coverage dan lokasi BTS"></div>
      <section class="panel" aria-labelledby="page-title">
        <div class="panel-heading">
          <div class="brand-mark" aria-hidden="true">B</div>
          <div>
            <p class="eyebrow">PETA JARINGAN</p>
            <h1 id="page-title">Coverage & BTS</h1>
          </div>
        </div>
        <p class="instruction">
          Klik lokasi untuk mengecek coverage. Setiap lokasi pilihan dan titik
          BTS memiliki lingkaran radius 1 km.
        </p>
        <div id="status" class="status" role="status" aria-live="polite">
          <span class="status-dot"></span>
          <span id="status-text">Menunggu lokasi dipilih</span>
        </div>
        <div id="results" class="results" aria-live="polite"></div>
        <section class="seen-section" aria-labelledby="seen-title">
          <div class="seen-heading">
            <div class="seen-title-group">
              <h2 id="seen-title">BTS Seen</h2>
              <span id="seen-count" class="seen-count">0</span>
            </div>
            <button id="export-csv" class="export-button" type="button" disabled>
              Export CSV
            </button>
          </div>
          <div id="seen-list" class="seen-list">
            <p class="seen-empty">BTS yang pernah ditemukan akan tersimpan di sini.</p>
          </div>
        </section>
        <div class="legend">
          <span class="legend-item"><i class="legend-dot selected"></i>Lokasi dipilih</span>
          <span class="legend-item"><i class="legend-dot bts"></i>Lokasi BTS</span>
          <span class="legend-item"><i class="legend-radius"></i>Radius 1 km</span>
        </div>
        <p class="attribution-note">
          Peta © OpenStreetMap · Leaflet
        </p>
      </section>
      <div id="map-error" class="map-error" role="alert" hidden></div>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/app.js"></script>
  </body>
</html>
